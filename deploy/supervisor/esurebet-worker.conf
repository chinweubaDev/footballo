; Esurebet — Laravel queue worker (Phase 1N)
;
; Deploy to /etc/supervisor/conf.d/esurebet-worker.conf and run:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start esurebet-worker:*
;
; Characteristics:
;   - database queue (QUEUE_CONNECTION=database)
;   - tries=3 (also set on the job classes)
;   - backoff 30s / 120s / 300s (also set on the job classes)
;   - survives SSH disconnect, terminal closure, worker failure and server
;     restart (autostart=true, autorestart=true)
;   - stopwaitsecs gives a long-running API call time to finish gracefully

[program:esurebet-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/forge/esurebet.com/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/home/forge/esurebet.com
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=forge
numprocs=2
redirect_stderr=true
stdout_logfile=/home/forge/esurebet.com/storage/logs/worker.log
stopwaitsecs=150

; If the server is on Horizon/Laravel Forge, the same effect is achieved by
; configuring a "Daemon" with:
;   Command: php artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=120
;   Directory: /home/forge/esurebet.com
;   Processes: 2
;
; Do NOT run `php artisan queue:work` in a foreground terminal as the
; production solution — it dies on SSH disconnect.
